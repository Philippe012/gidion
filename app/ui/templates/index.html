<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gidion — Clinical AI Assistant</title>
    <style>
        :root {
            --bg: #0f1420;
            --panel: #161d2e;
            --panel-2: #1d2740;
            --accent: #5b8cff;
            --accent-2: #7ad1c9;
            --text: #e8ecf7;
            --text-dim: #93a0c0;
            --urgent: #ff5b6e;
            --refer: #ffb84d;
            --follow: #6fc3ff;
            --home: #6fe0a0;
            --border: #232d47;
            --radius: 16px;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(1200px 800px at 20% -10%, #1a2440 0%, var(--bg) 55%);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 20, 32, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-brand .logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 2px 8px rgba(91, 140, 255, 0.3);
        }

        .header-brand h1 {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-brand .subtitle {
            font-size: 0.7rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-icon {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: rgba(91, 140, 255, 0.15);
            border-color: var(--accent);
            color: var(--text);
        }

        .btn-icon.active {
            background: rgba(111, 224, 160, 0.2);
            border-color: var(--home);
            color: var(--home);
        }

        .btn-icon.recording {
            background: rgba(255, 91, 110, 0.2);
            border-color: var(--urgent);
            color: var(--urgent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 91, 110, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255, 91, 110, 0); }
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: #2c3a63;
            border-radius: 3px;
        }

        .message {
            max-width: 85%;
            padding: 13px 16px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.55;
            animation: rise 0.3s ease;
            word-wrap: break-word;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), #4468d8);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 12px rgba(91, 140, 255, 0.25);
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message.urgent {
            background: linear-gradient(135deg, rgba(255,91,110,0.15), rgba(255,91,110,0.05));
            border: 2px solid var(--urgent);
            color: #ffcdd2;
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: var(--text-dim);
            font-size: 13px;
            padding: 8px;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 6px;
            text-align: right;
        }

        /* Urgency badge inside message */
        .urgency-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .urgency-critical {
            background: rgba(255,91,110,0.15);
            color: var(--urgent);
            border: 1px solid rgba(255,91,110,0.4);
        }

        .urgency-moderate {
            background: rgba(255,184,77,0.15);
            color: var(--refer);
            border: 1px solid rgba(255,184,77,0.4);
        }

        .urgency-mild {
            background: rgba(111,195,255,0.15);
            color: var(--follow);
            border: 1px solid rgba(111,195,255,0.4);
        }

        .urgency-normal {
            background: rgba(111,224,160,0.15);
            color: var(--home);
            border: 1px solid rgba(111,224,160,0.4);
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: var(--radius);
            border-bottom-left-radius: 4px;
            gap: 6px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Confirmation Chips */
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 16px;
            align-self: flex-start;
            max-width: 92%;
        }

        .chip {
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            transition: all 0.15s ease;
            user-select: none;
        }

        .chip:hover {
            border-color: var(--accent);
            background: #1c2440;
        }

        .chip.confirm {
            border-color: var(--home);
            color: var(--home);
        }

        .chip.confirm:hover {
            background: rgba(111, 224, 160, 0.15);
        }

        .chip.deny {
            border-color: var(--urgent);
            color: var(--urgent);
        }

        .chip.deny:hover {
            background: rgba(255, 91, 110, 0.15);
        }

        /* Input Area */
        .input-area {
            background: rgba(15, 20, 32, 0.95);
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .text-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--panel);
            color: var(--text);
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .text-input:focus {
            border-color: var(--accent);
        }

        .text-input::placeholder {
            color: var(--text-dim);
        }

        .send-btn, .mic-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent), #4468d8);
            color: white;
            box-shadow: 0 2px 12px rgba(91, 140, 255, 0.3);
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(91, 140, 255, 0.4);
        }

        .send-btn:disabled {
            background: #2c3a63;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .mic-btn {
            background: var(--panel);
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .mic-btn:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .mic-btn.recording {
            background: var(--urgent);
            border-color: var(--urgent);
            color: white;
            animation: pulse 1.5s infinite;
        }

        /* Disclaimer */
        .disclaimer {
            text-align: center;
            padding: 8px 16px;
            font-size: 11px;
            color: var(--text-dim);
            background: rgba(15, 20, 32, 0.95);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        /* Audio player button inside message */
        .audio-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: var(--text-dim);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Mobile */
        @media (max-width: 480px) {
            .header-brand h1 { font-size: 1rem; }
            .message { max-width: 90%; font-size: 14px; }
            .text-input { font-size: 16px; }
            .header { padding: 12px 14px; }
        }
    </style>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <div class="logo">🏥</div>
            <div>
                <h1>Gidion</h1>
                <div class="subtitle">Clinical AI Assistant</div>
            </div>
        </div>
        <div class="header-controls">
            <button class="btn-icon" id="voiceToggle" title="Toggle Voice">
                <i class="fas fa-volume-mute"></i>
            </button>
            <button class="btn-icon" id="newSessionBtn" title="New Chat">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </header>

    <div class="messages-container" id="messages">
        <!-- Messages appear here -->
    </div>

    <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>

    <div class="chips-container" id="chipsContainer"></div>

    <div class="input-area">
        <button class="mic-btn" id="micBtn" title="Voice Input">
            <i class="fas fa-microphone"></i>
        </button>
        <div class="input-wrapper">
            <input type="text" class="text-input" id="textInput" placeholder="Type your message..." autocomplete="off">
        </div>
        <button class="send-btn" id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <div class="disclaimer">
        This is a clinical decision support tool. Always consult a qualified healthcare professional.
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
